<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Upload — AI Business Twin</title>
  <meta name="description" content="Upload your business data to AI Business Twin." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
  <style>
    .upload-area {
      border: 2px dashed var(--beige);
      border-radius: var(--radius-md);
      padding: 40px 20px;
      text-align: center;
      background: var(--light-cream);
      transition: all var(--transition);
      cursor: pointer;
      margin-top: 8px;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(166, 106, 63, 0.05);
    }
    .upload-area input[type="file"] {
      display: none;
    }
    .upload-icon {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .upload-text {
      font-size: 0.95rem;
      color: var(--brown);
      font-weight: 500;
    }
    .upload-hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .file-selected {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--white);
      border: 1px solid var(--beige);
      border-radius: var(--radius-sm);
      margin-top: 12px;
    }
    .file-name {
      font-size: 0.9rem;
      color: var(--dark-brown);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }
    .btn-remove {
      background: none;
      border: none;
      color: #B85C3A;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-remove:hover {
      text-decoration: underline;
    }
    .select-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--beige);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--dark-brown);
      background: var(--light-cream);
      outline: none;
      cursor: pointer;
    }
    .select-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(166, 106, 63, 0.1);
      background: var(--white);
    }
  </style>
</head>
<body>

  <div class="dashboard-page">

    <!-- Dashboard Navbar -->
    <nav class="dashboard-nav">
      <div class="container">
        <a href="/" class="nav-logo">AI <span>Business Twin</span></a>
        <div class="dashboard-nav-right">
          <a href="/dashboard" class="dashboard-user" style="text-decoration: none; margin-right: 16px;">Back to Dashboard</a>
          <button class="btn-logout" id="logout-btn">Log Out</button>
        </div>
      </div>
    </nav>

    <!-- Upload Content -->
    <main class="dashboard-content" style="align-items: flex-start; padding-top: 60px;">
      <div class="auth-card" style="width: 100%; max-width: 500px; margin: 0 auto;">
        <h1>Upload Business Data</h1>
        <p class="auth-subtitle">Add your CSV or Excel files to keep your twin up to date.</p>

        <div class="auth-message" id="upload-message" role="alert"></div>

        <form class="auth-form" id="upload-form">
          <div class="form-group">
            <label for="data_type">Data Type</label>
            <select id="data_type" name="data_type" class="select-input" required>
              <option value="" disabled selected>Select what kind of data this is...</option>
              <option value="sales">Sales & Revenue</option>
              <option value="products">Products & Services</option>
              <option value="inventory">Inventory & Stock</option>
              <option value="expenses">Expenses & Costs</option>
            </select>
          </div>

          <div class="form-group">
            <label>Data File</label>
            <div class="upload-area" id="upload-area">
              <div class="upload-icon">↑</div>
              <div class="upload-text">Click or drag file here to upload</div>
              <div class="upload-hint">Supports .csv, .xlsx, .xls</div>
              <input type="file" id="file_input" name="file" accept=".csv, .xlsx, .xls" required />
            </div>
            
            <div class="file-selected" id="file-selected">
              <span class="file-name" id="file-name-display">filename.csv</span>
              <button type="button" class="btn-remove" id="btn-remove-file">Remove</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="upload-btn">Upload Data</button>
        </form>
      </div>
    </main>

  </div>

  <script src="/static/js/upload.js"></script>
</body>
</html>
